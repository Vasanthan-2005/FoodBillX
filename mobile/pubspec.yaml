name: mobile
description: "HMB Bills - Honeymoon Biryani POS System"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.3.1
  flutter_animate: ^4.5.2

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & Storage
  dio: ^5.8.0+1
  shared_preferences: ^2.5.2

  # Date, Time & Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Invoice & PDF Sharing
  pdf: ^3.11.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21