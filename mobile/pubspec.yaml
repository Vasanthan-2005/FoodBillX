name: mobile
description: "FoodBillX - Food Truck Billing System"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.3.1
  flutter_animate: ^4.5.2

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & Storage
  dio: ^5.8.0+1
  shared_preferences: ^2.5.2

  # Local Database (Offline-First)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Connectivity
  connectivity_plus: ^6.1.4

  # Date, Time & Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Invoice & PDF Sharing
  pdf: ^3.11.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation for Isar
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Fonts (We'll add custom fonts later if needed)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf